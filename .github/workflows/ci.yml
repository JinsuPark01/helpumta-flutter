name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Flutter 테스트
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get

      - run: flutter test

  ios-build:
    name: iOS 빌드 검증
    runs-on: macos-latest
    needs: test   # 테스트가 통과해야 빌드 진행
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - run: flutter pub get

      # 서명 없이 빌드만 검증 (실기기 설치는 불가)
      - run: flutter build ios --release --no-codesign